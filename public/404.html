<!DOCTYPE html>

  <style>

    body {

    .icon-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #6E472A;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-circle svg {

      color: #6E472A;

      padding: 14px 28px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      color: white;
      background: #A4D045;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 20px rgba(164, 208, 69, 0.35);
    }
    .btn-home:hover {
      transform: scale(1.04);
      box-shadow: 0 6px 28px rgba(164, 208, 69, 0.45);
    }
    .btn-home:active {
      transform: scale(0.97);
    }
    .btn-home svg {
      width: 18px;
      height: 18px;
    }
    .divider {
      height: 1px;
      background: #d4c4b0;
      margin: 32px 0;
    }
    .help-text {
      font-size: 12px;
      color: #8f7065;
      line-height: 1.5;
    }
    .help-text a {
      color: #6E472A;
      font-weight: 600;
      text-decoration: underline;
