<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error del servidor | Market Coffee Sweet</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Estamos experimentando problemas técnicos. Intenta de nuevo en unos minutos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #F8F6F0;
      color: #2B1E16;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 420px;
    }
    .error-code {
      font-size: clamp(80px, 20vw, 140px);
      font-weight: 900;
      line-height: 1;
      color: #D32F2F;
      opacity: 0.12;
      position: relative;
    }
    .icon-circle {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #D32F2F;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-circle svg {
      width: 30px;
      height: 30px;
      color: white;
    }
    .title {
      font-size: 24px;
      font-weight: 800;
      margin: 24px 0 12px;
      color: #2B1E16;
    }
    .subtitle {
      font-size: 14px;
      line-height: 1.6;
      color: #6E472A;
      margin-bottom: 32px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      color: white;
      background: #A4D045;
      border: none;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 20px rgba(164, 208, 69, 0.35);
    }
    .btn-retry:hover {
      transform: scale(1.04);
      box-shadow: 0 6px 28px rgba(164, 208, 69, 0.45);
    }
    .btn-retry:active {
      transform: scale(0.97);
    }
    .btn-retry svg {
      width: 18px;
      height: 18px;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      color: #6E472A;
      background: transparent;
      border: 2px solid #d4c4b0;
      text-decoration: none;
      margin-left: 12px;
      transition: all 0.15s;
    }
    .btn-home:hover {
      border-color: #6E472A;
      background: #6E472A;
      color: white;
    }
    .divider {
      height: 1px;
      background: #d4c4b0;
      margin: 32px 0;
    }
    .help-text {
      font-size: 12px;
      color: #8f7065;
      line-height: 1.5;
    }
    .help-text a {
      color: #6E472A;
      font-weight: 600;
      text-decoration: underline;
    }
    .status-info {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      background: #FFF3E0;
      color: #E65100;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #E65100;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="error-code">
      500
      <div class="icon-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
    </div>

    <div class="status-info">
      <span class="status-dot"></span>
      Problema temporal detectado
    </div>

    <h1 class="title">Algo salió mal</h1>
    <p class="subtitle">
      Nuestros servidores están teniendo un problema técnico.
      No te preocupes, tu pedido no se ha perdido. Intenta de nuevo en unos minutos.
    </p>

    <div>
      <button onclick="window.location.reload()" class="btn-retry">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          <polyline points="21,3 21,9 15,9"/>
        </svg>
        Intentar de Nuevo
      </button>
      <a href="/" class="btn-home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9,22 9,12 15,12 15,22"/>
        </svg>
        Inicio
      </a>
    </div>

    <div class="divider"></div>

    <p class="help-text">
      Si el problema persiste, escríbenos por
      <a href="https://wa.me/584123758879" target="_blank" rel="noopener">WhatsApp</a>
      o llámanos al <strong>0412-3758879</strong>.
    </p>
  </div>

  <script>
    // Auto-retry after 30 seconds
    setTimeout(function() {
      var btn = document.querySelector('.btn-retry');
      if (btn) {
        btn.textContent = 'Recargando...';
        window.location.reload();
      }
    }, 30000);
  </script>
</body>
</html>
