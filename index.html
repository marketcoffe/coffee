    <link rel="stylesheet" href="/leaflet/leaflet.css" media="print" onload="this.media='all'" />

    <style id="preload-bg">body { background-color: #F8F6F0; }</style>

  <body class="bg-[#F8F6F0] text-[#2B1E16] antialiased overflow-x-hidden">
    <!-- Clear old caches + apply config before React loads -->
    <script>
      (function() {
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) {
              if (name.startsWith('workbox-precache') || name.startsWith('supabase') || name.startsWith('images-cache')) {
                caches.delete(name);
              }
            });
          });
        }

        var manifestLink = document.getElementById('pwa-manifest');
        var isAdmin = window.location.pathname.startsWith('/admin');
        if (manifestLink && isAdmin) {
          manifestLink.href = '/manifest-admin.json';
              document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', 'Market Coffee Sweet Admin');
        }

        try {
          var saved = localStorage.getItem('trv_config');
          if (saved) {
            var cfg = JSON.parse(saved);
            if (cfg.theme_color) {
              document.getElementById('preload-bg').textContent = 'body { background-color: ' + cfg.theme_color + '; }';
              document.querySelector('meta[name="theme-color"]').setAttribute('content', cfg.theme_color);
            }
            if (cfg.site_nombre) {
              document.title = cfg.site_nombre + ' | Panadería, Comida Rápida y Víveres';
              document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', cfg.site_nombre);
              document.querySelector('meta[property="og:site_name"]').setAttribute('content', cfg.site_nombre);
            }
            if (cfg.pwa_icon_url && manifestLink) {
              var iconUrl = cfg.pwa_icon_url;
              if (iconUrl && (iconUrl.startsWith('http://') || iconUrl.startsWith('https://') || iconUrl.startsWith('data:'))) {
              var manifestHref = manifestLink.getAttribute('href') || manifestLink.href;
              fetch(manifestHref).then(function(r) { return r.json(); }).then(function(baseManifest) {
                var origin = window.location.origin;
                baseManifest.icons = baseManifest.icons.map(function(icon) {
                  return Object.assign({}, icon, { src: iconUrl });
                });
                if (baseManifest.start_url && !baseManifest.start_url.startsWith('http')) {
                  baseManifest.start_url = origin + baseManifest.start_url;
                }
                if (baseManifest.scope && !baseManifest.scope.startsWith('http')) {
                  baseManifest.scope = origin + baseManifest.scope;
                }
                if (baseManifest.id && !baseManifest.id.startsWith('http')) {
                  baseManifest.id = origin + baseManifest.id;
                }
                if (baseManifest.shortcuts) {
                  baseManifest.shortcuts = baseManifest.shortcuts.map(function(s) {
                    var fixed = Object.assign({}, s);
                    if (fixed.url && !fixed.url.startsWith('http')) {
                      fixed.url = origin + fixed.url;
                    }
                    if (fixed.icons) {
                      fixed.icons = fixed.icons.map(function(ic) {
                        var newIc = Object.assign({}, ic);
                        if (newIc.src && !newIc.src.startsWith('http') && !newIc.src.startsWith('data:')) {
                          newIc.src = origin + newIc.src;
                        }
                        return newIc;
                      });
                    }
                    return fixed;
                  });
                }
                if (cfg.theme_color) {
                  baseManifest.theme_color = cfg.theme_color;
                  baseManifest.background_color = cfg.theme_color;
                }
                if (cfg.site_nombre) {
                  baseManifest.name = cfg.site_nombre;
                  baseManifest.short_name = cfg.site_nombre.substring(0, 12);
                }
                var blob = new Blob([JSON.stringify(baseManifest)], { type: 'application/json' });
                var blobUrl = URL.createObjectURL(blob);
                manifestLink.href = blobUrl;
              }).catch(function() {});
              }
            }
          }
        } catch(e) {}
      })();
    </script>
    <div id="root"></div>
    <!-- Leaflet JS (lazy-loaded, self-hosted) -->
    <script>
      window.addEventListener('DOMContentLoaded', function() {
        var script = document.createElement('script');
        script.src = '/leaflet/leaflet.js';
        script.async = true;
        document.body.appendChild(script);
      });
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
